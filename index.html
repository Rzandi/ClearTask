<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: blob: data:;"
    />

    <!-- SEO -->
    <title>ClearTask — Aplikasi Pencatatan Penjualan Digital</title>
    <meta
      name="description"
      content="ClearTask membantu pemilik bisnis dan kasir mencatat transaksi harian, memantau penjualan real-time, dan mengekspor laporan ke Excel."
    />
    <link rel="canonical" href="https://cleartask.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClearTask — Aplikasi Pencatatan Penjualan Digital" />
    <meta
      name="twitter:description"
      content="ClearTask membantu pemilik bisnis dan kasir mencatat transaksi harian, memantau penjualan real-time, dan mengekspor laporan ke Excel."
    />
    <meta name="twitter:image" content="/assets/icons/manifest-icon-512.maskable.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ClearTask",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "IDR"
        },
        "description": "Aplikasi pencatatan penjualan digital dan kasir POS offline-ready untuk UMKM."
      }
    </script>

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/icons/manifest-icon-192.maskable.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-icon-180.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#00f0ff" />

    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClearTask" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClearTask" />
    <meta
      property="og:description"
      content="Catat transaksi harian, pantau penjualan real-time, dan ekspor laporan ke Excel."
    />
    <meta property="og:image" content="/assets/logo.png" />

    <!-- Google Fonts: Inter (Data/Financial) & Outfit (Brand) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root">
      <!-- Loading indicator (replaced when React mounts) -->
      <div
        id="app-loader"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #0c0e12;
          color: #a0a0b0;
          font-family: system-ui, sans-serif;
          gap: 1rem;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(37, 99, 235, 0.2);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
          "
        ></div>
        <p>Memuat ClearTask...</p>
        <style>
          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
    <!-- Global error catcher: show JS errors on screen for mobile debugging -->
    <script>
      window.onerror = function (msg, src, line, col, err) {
        var d = document.getElementById('app-loader') || document.getElementById('root');
        if (d) {
          d.innerHTML =
            '<div style="padding:2rem;background:#0a0a0f;color:#ff6b6b;font-family:monospace;font-size:13px;min-height:100vh;">' +
            '<h2 style="color:#ff4a4a;margin-bottom:1rem;">⚠️ ClearTask Error</h2>' +
            '<p style="color:#ccc;margin-bottom:.5rem;word-break:break-all;"><b>Error:</b> ' +
            msg +
            '</p>' +
            '<p style="color:#888;margin-bottom:.5rem;word-break:break-all;"><b>File:</b> ' +
            (src || 'unknown') +
            ':' +
            (line || '?') +
            '</p>' +
            '<p style="color:#888;margin-bottom:1.5rem;word-break:break-all;"><b>Detail:</b> ' +
            (err && err.stack ? err.stack : 'none') +
            '</p>' +
            '<button onclick="location.reload()" style="padding:.6rem 1.5rem;background:#00ffa3;color:#0a0a0f;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Reload</button>' +
            '</div>';
        }
      };
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e.reason ? e.reason.message || e.reason.toString() : 'Unknown promise rejection';
        window.onerror(msg, '', 0, 0, e.reason);
      });
    </script>
    <!-- Cache-buster: auto-clear stale SW cache on version mismatch -->
    <script>
      (function () {
        var SW_VERSION = 'v3.6.0';
        var FLAG = 'cleartask_sw_version';
        try {
          var prev = localStorage.getItem(FLAG);
          if (prev && prev === SW_VERSION) return;
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                r.unregister();
              });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (n) {
                caches.delete(n);
              });
            });
          }
          localStorage.setItem(FLAG, SW_VERSION);
          if (prev) {
            location.reload();
            return;
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
